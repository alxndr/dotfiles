set -s command-alias 'ls=list-sessions -F "#{session_name}: #{session_windows} windows (created #{t/f/%y-%m-%d %H#:%M#:%S:window_activity}) #{?session_attached, [attached],}"'

# status bar: dim slate-purple background, light-gray text
set -g status-style 'bg=colour60,fg=colour253'

# status bar: show each window's pane title right after its name (moved off status-right)
set -g window-status-format '#I:#W#{?window_flags,#{window_flags},} "#{pane_title}"'
set -g window-status-current-format '#I:#W#{?window_flags,#{window_flags},} "#{pane_title}"'

# status bar, right side: date before time (was time before date), plus a battery/power icon.
# `battery_icon` is a zsh function (defined next to `battery` in .zshenv) — invoked via
# `zsh -c` since tmux runs #() commands outside any shell rc/profile chain, and .zshenv is
# the one dotfile zsh always sources regardless of interactive/login status.
set -g status-right '#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}%d-%b-%y %H:%M #(zsh -c battery_icon)'
